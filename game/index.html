<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Legends: Last Flight</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10141b; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #selftest { position: absolute; left: 8px; top: 8px; z-index: 5; color: #7dff9a; background: rgba(0,0,0,0.7);
    font: 12px monospace; white-space: pre; margin: 0; padding: 8px; display: none; }
  #selftest.on { display: block; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sky Legends Last Flight: a sunset flight simulator. Fly with W A S D, throttle with Shift and Control."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="selftest"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
